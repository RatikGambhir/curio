name: Shared clients

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      # CI validates artifacts without contacting the service. Release workflows
      # must replace this with the actual deployed HTTPS endpoint.
      VITE_CURIO_SERVICE_URL: https://service.example.com
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run check:architecture
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
      - run: npm run build:desktop-ui
      - name: Check desktop Rust
        working-directory: web/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  curio-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: curio_test
          POSTGRES_USER: curio_test_runner
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U curio_test_runner -d curio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # This credential reaches only the disposable PostgreSQL container above.
      # Pull-request code never receives a Railway or production secret.
      CURIO_TEST_DATABASE_URL: postgresql://curio_test_runner:ci-local-only@127.0.0.1:5432/curio_test
    defaults:
      run:
        working-directory: curio-service
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Verify the default runtime excludes SQLite
        shell: bash
        run: |
          dependency_tree="$(cargo tree --edges normal)"
          grep -q "sqlx-postgres" <<<"$dependency_tree"
          if grep -q "sqlx-sqlite" <<<"$dependency_tree"; then
            echo "The default curio-service dependency graph includes sqlx-sqlite." >&2
            exit 1
          fi
      - run: cargo test
      - run: cargo test --features sqlite-import --test sqlite_import
