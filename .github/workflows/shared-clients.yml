name: Shared clients

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      # CI validates artifacts without contacting the service. Release workflows
      # must replace this with the actual deployed HTTPS endpoint.
      VITE_CURIO_SERVICE_URL: https://service.example.com
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run check:architecture
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
      - run: npm run build:desktop-ui
      - name: Check desktop Rust
        working-directory: web/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  curio-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: curio-service
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
