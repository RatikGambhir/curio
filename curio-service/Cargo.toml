[package]
name = "curio-service"
version = "0.1.0"
edition = "2024"

[features]
default = []

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1.4.0"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "migrate", "macros", "tls-rustls-ring-webpki"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15"
uuid = { version = "1.26.0", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Document parsing, chunking, hashing, and preview rendering.
base64 = "0.22"
calamine = "0.36.1"
docx-rust = "0.1.11"
image = { version = "0.24.9", default-features = false, features = ["png"] }
lopdf = { version = "0.42.0", default-features = false, features = ["wasm_js"] }
pdf-extract = "0.12.0"
pptx-to-md = "0.4.0"
sha2 = "0.10"
tiktoken-rs = "0.12.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
